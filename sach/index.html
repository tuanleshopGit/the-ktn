<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sách KTN</title><meta name="theme-color" content="#2443d6">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--n:#2443d6;--bg:#f3f5fb;--c:#fff;--t:#1b2140;--m:#5b6585;--l:#dfe3f0;--ok:#16a34a;--on:#e11d48;--ipa:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:5;background:var(--n);color:#fff;padding:10px 16px 0}
header h1{margin:0;font-size:19px}header small{opacity:.8;font-size:12px}
nav{display:flex;gap:4px;margin-top:8px}nav button{flex:1;background:none;border:0;color:#fff;opacity:.7;padding:10px 0;font-size:15px;border-bottom:3px solid transparent}
nav button.on{opacity:1;border-color:#fff;font-weight:600}
main{max-width:720px;margin:0 auto;padding:14px 16px 90px}
h2{font-size:13px;letter-spacing:.06em;color:var(--m);margin:22px 0 8px;text-transform:uppercase}
.bai{display:flex;align-items:center;gap:12px;background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.bai:active{background:#eef1fb}.so{min-width:38px;height:38px;border-radius:10px;background:#e8ecfb;color:var(--n);display:grid;place-items:center;font-weight:700;font-size:13px}
.bai b{display:block;font-size:16px}.bai span{font-size:13px;color:var(--m)}
.vach{height:4px;background:#e5e8f2;border-radius:3px;margin-top:6px;overflow:hidden}.vach i{display:block;height:100%;background:var(--ok)}
.lui{background:none;border:0;color:var(--n);font-size:15px;padding:6px 0;cursor:pointer}
.muc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.muc span{background:#e8ecfb;color:#26357a;border-radius:20px;padding:5px 10px;font-size:13px}
.seg{display:flex;background:#e5e8f2;border-radius:10px;padding:3px;margin:8px 0 14px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-size:14px;color:var(--m)}
.seg button.on{background:#fff;color:var(--t);font-weight:600;box-shadow:0 1px 2px #0002}
.trang{background:#fff;border:1px solid var(--l);border-radius:8px;margin-bottom:12px;overflow:hidden}.trang img{width:100%;display:block}
.trang div{font-size:12px;color:var(--m);padding:4px 10px;border-top:1px solid var(--l);display:flex;justify-content:space-between}
.trang a{color:var(--n)}
.cau{display:flex;gap:10px;background:var(--c);border:1px solid var(--l);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.cau.dang{border-color:var(--n);box-shadow:0 0 0 2px #2443d633}
.loa{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:#e8ecfb;color:var(--n);font-size:17px;cursor:pointer}
.loa:active{background:var(--n);color:#fff}
.en{font-size:16px;line-height:1.4}.ipa{color:var(--ipa);font-size:14px;margin-top:2px;font-family:"Segoe UI","Lucida Sans Unicode",sans-serif}
.vi{color:var(--m);font-size:14px;margin-top:2px}.ghi{font-size:12px;color:#9a6700;margin-top:2px}
.nut{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--n);color:#fff;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer}
.nut.phu{background:#fff;color:var(--n);border:1px solid var(--n)}
.hang{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:15px}td,th{border-bottom:1px solid var(--l);padding:8px 6px;text-align:left}th{font-size:12px;color:var(--m)}
select,input[type=search]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--l);border-radius:10px;background:#fff}
.the{perspective:1200px;margin:14px 0}.the-in{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.the-in.lat{transform:rotateY(180deg)}.mat{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--l);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;box-shadow:0 4px 14px #1b214014}
.sau{transform:rotateY(180deg)}.mat .to{font-size:22px;font-weight:600;line-height:1.35}.mat .goi{font-size:13px;color:var(--m)}
.dem{display:flex;justify-content:space-between;font-size:13px;color:var(--m)}
.chon2{display:flex;gap:10px}.chon2 button{flex:1;padding:14px;border-radius:12px;border:0;font-size:16px;font-weight:600;color:#fff;cursor:pointer}
.chon2 .on{background:var(--on)}.chon2 .ok{background:var(--ok)}
.trong{color:var(--m);text-align:center;padding:30px 0}
mark{background:#fde68a;border-radius:3px}
</style></head><body>

<script>

:"","ghi":"","tr":20,"a":"2b7caff6557a"},{"en":"To Learn English is very easy at SEC.","vi":"","ipa":"","ghi":"","tr":20,"a":"7903a4366e7f"},{"en":"More than one man loves me so much.","vi":"","ipa":"","ghi":"","tr":20,"a":"ffd5e18821de"},{"en":"More than one person has known the news.","vi":"","ipa":"","ghi":"","tr":20,"a":"fa2015297eb5"},{"en":"Tien Dat Corporation is very rich and famous.","vi":"","ipa":"","ghi":"","tr":20,"a":"145689777684"},{"en":"Both Thai and Nam have learned English for 2 months.","vi":"","ipa":"","ghi":"","tr":20,"a":"c6abbab882a4"},{"en":"The poor need help.","vi":"","ipa":"","ghi":"","tr":20,"a":"1eb119ddf325"},{"en":"Thai and Hung love Dat.","vi":"","ipa":"","ghi":"","tr":20,"a":"16ebe5200317"},{"en":"Bread and butter is my daily food.","vi":"","ipa":"","ghi":"","tr":20,"a":"a221a01b1f97"},{"en":"Nam, along with his parents, is going to the party on Sunday.","vi":"","ipa":"","ghi":"","tr":20,"a":"14e716fa792d"},{"en":"Not only Nam but also his parents want to know the result.","vi":"","ipa":"","ghi":"","tr":20,"a":"c409966056d3"},{"en":"There are 2 apples.","vi":"","ipa":"","ghi":"","tr":21,"a":"80790242c311"},{"en":"There is an apple.","vi":"","ipa":"","ghi":"","tr":21,"a":"5d3a67fc3b74"},{"en":"I gave the book to Hoa.","vi":"","ipa":"","ghi":"","tr":21,"a":"dd5289b0b9b6"},{"en":"I gave Hoa the book.","vi":"","ipa":"","ghi":"","tr":21,"a":"a545995aa1bc"},{"en":"Sai: I gave Hoa to the book.","vi":"","ipa":"","ghi":"","tr":21,"a":"1dbe282e374d"},{"en":"Sai: They gave us it.","vi":"","ipa":"","ghi":"","tr":21,"a":"97e941e5163b"},{"en":"She enjoys playing tennis.","vi":"","ipa":"","ghi":"","tr":21,"a":"beba1b86c1f0"},{"en":"We are considering going to Canada.","vi":"","ipa":"","ghi":"","tr":21,"a":"2a2fa38c71c2"},{"en":"He hasn't finished speaking.","vi":"","ipa":"","ghi":"","tr":21,"a":"a4085f7f1140"},{"en":"I want to speak English.","vi":"","ipa":"","ghi":"","tr":21,"a":"aad25d4d7c4c"},{"en":"I plan to learn English at SEC.","vi":"","ipa":"","ghi":"","tr":21,"a":"da5064e2301a"},{"en":"We agreed to meet on Thursday.","vi":"","ipa":"","ghi":"","tr":21,"a":"47a67c880878"},{"en":"I don’t remember meeting Susan before.","vi":"Tôi không nhớ gặp Susan trước đây","ipa":"","ghi":"","tr":22,"a":"1c3a5ed13918"},{"en":"Remember to send this letter to me.","vi":"Hãy nhớ gửi bức thư này cho tôi","ipa":"","ghi":"","tr":22,"a":"7d48a608f3e9"}]},{"id":"b06","phan":"Phần 1 · Kiến thức nền","ten":"Trạng từ + Phủ định","tu":23,"den":24,"muc":["Chức năng, cấu tạo Adv = Adj + ly","3 vị trí của trạng từ","Sự phủ định"],"cau":[{"en":"He behaved in a friendly way.","vi":"","ipa":"","ghi":"","tr":23,"a":"15f493dfb074"},{"en":"He drove slowly on the street after the party.","vi":"","ipa":"","ghi":"","tr":23,"a":"b234c448b537"},{"en":"He traveled to Viet Nam three times last year.","vi":"","ipa":"","ghi":"","tr":23,"a":"7eee0b0141d4"},{"en":"I go home by bus two times a week.","vi":"","ipa":"","ghi":"","tr":23,"a":"8bae20859318"},{"en":"He no longer studies at the university.","vi":"Anh ấy không còn học đại học nữa","ipa":"","ghi":"","tr":24,"a":"63935487de7c"},{"en":"We don’t talk anymore.","vi":"Chúng ta không nói chuyện nữa","ipa":"","ghi":"","tr":24,"a":"5508f50ef459"},{"en":"She is as beautiful as Ngoc Trinh.","vi":"","ipa":"","ghi":"","tr":24,"a":"4f68b9fd0e4b"},{"en":"Nam runs as quickly as Mr. Bolt.","vi":"","ipa":"","ghi":"","tr":24,"a":"f2d0206ecc7d"},{"en":"I have as much money as Mr. Bill Gates.","vi":"","ipa":"","ghi":"","tr":24,"a":"fb0ba8c2979a"},{"en":"I have as many computers as Mr. Bill Gates.","vi":"","ipa":"","ghi":"","tr":24,"a":"11b268164297"},{"en":"He speaks English more quickly than me.","vi":"","ipa":"","ghi":"","tr":24,"a":"e752a8744726"},{"en":"Nam has more girlfriends than Hung.","vi":"","ipa":"","ghi":"","tr":24,"a":"0a3bd415b2a6"},{"en":"Nam runs less quickly than Hung.","vi":"","ipa":"","ghi":"","tr":24,"a":"765533113ddc"}]},{"id":"b07","phan":"Phần 1 · Kiến thức nền","ten":"So sánh tính từ, trạng từ","tu":24,"den":30,"muc":["So sánh bằng, hơn, nhất","So sánh của động từ","Quy tắc so sánh ADJ/ADV ngắn","Quy tắc thành lập trạng từ"],"cau":[{"en":"He no longer studies at the university.","vi":"Anh ấy không còn học đại học nữa","ipa":"","ghi":"","tr":24,"a":"63935487de7c"},{"en":"We don’t talk anymore.","vi":"Chúng ta không nói chuyện nữa","ipa":"","ghi":"","tr":24,"a":"5508f50ef459"},{"en":"She is as beautiful as Ngoc Trinh.","vi":"","ipa":"","ghi":"","tr":24,"a":"4f68b9fd0e4b"},{"en":"Nam runs as quickly as Mr. Bolt.","vi":"","ipa":"","ghi":"","tr":24,"a":"f2d0206ecc7d"},{"en":"I have as much money as Mr. Bill Gates.","vi":"","ipa":"","ghi":"","tr":24,"a":"fb0ba8c2979a"},{"en":"I have as many computers as Mr. Bill Gates.","vi":"","ipa":"","ghi":"","tr":24,"a":"11b268164297"},{"en":"He speaks English more quickly than me.","vi":"","ipa":"","ghi":"","tr":24,"a":"e752a8744726"},{"en":"Nam has more girlfriends than Hung.","vi":"","ipa":"","ghi":"","tr":24,"a":"0a3bd415b2a6"},{"en":"Nam runs less quickly than Hung.","vi":"","ipa":"","ghi":"","tr":24,"a":"765533113ddc"},{"en":"Mr. Bill Gates has less money than Mr. Dat.","vi":"","ipa":"","ghi":"","tr":25,"a":"4d0f453c96c2"},{"en":"Mr. Bill Gates is the richest in the world.","vi":"","ipa":"","ghi":"","tr":25,"a":"bc923afc178f"},{"en":"Hung is the fattest in my English class.","vi":"","ipa":"","ghi":"","tr":25,"a":"f86682baf8d1"},{"en":"I am five times as handsome as Nam.","vi":"","ipa":"","ghi":"","tr":25,"a":"a716fd4ba0d3"},{"en":"This table is 2 times as long as that table.","vi":"","ipa":"","ghi":"","tr":25,"a":"a2ffa9093f35"},{"en":"The sooner you learn English, the better you feel.","vi":"","ipa":"","ghi":"","tr":25,"a":"3c4913eddfb1"},{"en":"I am much more handsome than him.","vi":"Tôi đẹp trai hơn anh ấy nhiều.","ipa":"","ghi":"","tr":25,"a":"025de58b8751"},{"en":"I am more handsome than him.","vi":"","ipa":"","ghi":" informal ","tr":25,"a":"def084634344"},{"en":"I am more handsome than he is.","vi":"","ip     t += '<table><tr><th></th><th>V1</th><th>V2</th><th>V3</th><th>Nghĩa</th></tr>' + D.bqt.map(x => `<tr class="cau-r" data-a="${x.a}"><td><button class="loa" data-a="${x.a}">🔊</button></td><td><b>${esc(x.v1)}</b></td><td>${esc(x.v2)}</td><td>${esc(x.v3)}</td><td>${esc(x.vi)}</td></tr>`).join('') + '</table>';
  } else if (id === 'pv') {
    t += D.pv.map(x => `<div class="cau" data-a="${x.a}"><button class="loa" data-a="${x.ac}">🔊</button><div><div class="en"><b>${esc(x.cum)}</b> – ${esc(x.vi)}</div><div class="vi" style="color:var(--t)">${esc(x.en)} <button class="loa" style="width:30px;height:30px;font-size:13px;vertical-align:middle" data-a="${x.a}">🔊</button></div></div></div>`).join('');
  } else {
    t += b.cau.map(c => `<div class="cau" data-a="${c.a}"><button class="loa" data-a="${c.a}">🔊</button><div><div class="en">${esc(c.en)}</div>${c.ipa ? `<div class="ipa">${esc(c.ipa)}</div>` : ''}${c.vi ? `<div class="vi">${esc(c.vi)}</div>` : ''}${c.ghi ? `<div class="ghi">${esc(c.ghi)}</div>` : ''}<div class="ghi" style="color:var(--m)">Trang ${c.tr}</div></div></div>`).join('');
  }
  nd.innerHTML = t;
  nd.querySelectorAll('.loa').forEach(e => e.onclick = ev => { ev.stopPropagation(); dungDoc(); phat(e.dataset.a); });
  $('#onBai').onclick = () => moOn(id);
  $('#docHet').onclick = () => {
    if (hang.length) { dungDoc(); return; }
    hang = [...nd.querySelectorAll('[data-a].cau, [data-a].cau-r')]; let i = 0;
    const tiep = () => {
      document.querySelectorAll('.cau.dang').forEach(e => e.classList.remove('dang'));
      if (!hang.length || i >= hang.length) { hang = []; return; }
      const e = hang[i++]; e.classList.add('dang'); e.scrollIntoView({block: 'center', behavior: 'smooth'});
      phat(e.dataset.a, () => setTimeout(tiep, 900));
    };
    tiep();
  };
}

let on = {id: '', ds: [], i: 0};
function moOn(id) {
  dungDoc(); location.hash = 'on'; nav('on', true);
  const chon = [['tat', 'Tất cả câu mẫu'], ['can', 'Thẻ đang cần ôn'], ...BAI.filter(b => b.id !== 'mo').map(b => [b.id, b.ten])];
  id = id || on.id || 'b01';
  let ds;
  if (id === 'tat') ds = BAI.filter(b => b.cau).flatMap(b => the(b.id));
  else if (id === 'can') ds = BAI.filter(b => b.id !== 'mo').flatMap(b => the(b.id)).filter(t => tien[t.k] === 0);
  else ds = the(id);
  ds = ds.filter(t => tien[t.k] !== 1).sort(() => Math.random() - .5).concat(ds.filter(t => tien[t.k] === 1));
  on = {id, ds, i: 0};
  m.innerHTML = `<select id="chon">${chon.map(([v, n]) => `<option value="${v}" ${v === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select><div id="o"></div>`;
  $('#chon').onchange = e => moOn(e.target.value);
  veThe();
}
function veThe() {
  const o = $('#o'), {ds, i} = on;
  if (!ds.length) { o.innerHTML = '<div class="trong">Chưa có thẻ nào ở mục này.</div>'; return; }
  if (i >= ds.length) { const t = ds.filter(x => tien[x.k] === 1).length; o.innerHTML = `<div class="trong">Hết lượt: thuộc ${t}/${ds.length} thẻ.<br><br><button class="nut" id="lai">Ôn lại</button></div>`; $('#lai').onclick = () => moOn(on.id); return; }
  const t = ds[i], thuoc = ds.filter(x => tien[x.k] === 1).length;
  const truoc = t.truoc ? `<div class="to">${esc(t.truoc)}</div>` : `<button class="loa" style="width:64px;height:64px;font-size:28px" data-a="${t.a}">🔊</button>`;
  o.innerHTML = `<div class="dem" style="margin-top:12px"><span>Thẻ ${i + 1}/${ds.length}</span><span>Đã thuộc ${thuoc}</span></div>
   <div class="the"><div class="the-in" id="ti"><div class="mat">${truoc}<div class="goi">${esc(t.goi)}</div><div class="goi">Chạm để lật</div></div>
   <div class="mat sau"><div class="to">${esc(t.sau)}</div>${t.phu ? `<div class="${t.bai === 'pv' ? 'vi' : 'ipa'}">${esc(t.phu)}</div>` : ''}${t.vi && !t.truoc ? '' : ''}<button class="loa" data-a="${t.a}">🔊</button><div class="goi">${esc((theo(t.bai) || {}).ten || '')}</div></div></div></div>
   <div class="chon2"><button class="on">Cần ôn</button><button class="ok">Đã thuộc</button></div>`;
  const ti = $('#ti');
  ti.onclick = () => { ti.classList.toggle('lat'); if (ti.classList.contains('lat')) phat(t.a); };
  o.querySelectorAll('.loa').forEach(e => e.onclick = ev => { ev.stopPropagation(); phat(e.dataset.a); });
  if (!t.truoc) phat(t.a);
  o.querySelector('.on').onclick = () => { tien[t.k] = 0; luu(); on.i++; veThe(); };
  o.querySelector('.ok').onclick = () => { tien[t.k] = 1; luu(); on.i++; veThe(); };
}

function moTra() {
  dungDoc(); location.hash = 'tra';
  m.innerHTML = `<input type="search" id="q" placeholder="Gõ chữ Anh hoặc Việt: whom, giới từ, broke…" autofocus><div id="kq" style="margin-top:12px"></div>`;
  const kho = [
    ...BAI.filter(b => b.cau).flatMap(b => b.cau.map(c => ({a: c.a, en: c.en, vi: c.vi, ipa: c.ipa, n: b.ten + ' · trang ' + c.tr}))),
    ...D.bqt.map(x => ({a: x.a, en: x.v1 + ' – ' + x.v2 + ' – ' + x.v3, vi: x.vi, n: 'Bất quy tắc'})),
    ...D.pv.map(x => ({a: x.a || x.ac, en: x.cum + ': ' + x.en, vi: x.vi, n: 'Phrasal verb'}))];
  const bo = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  $('#q').oninput = e => {
    const q = bo(e.target.value.trim()); if (q.length < 2) { $('#kq').innerHTML = ''; return; }
    const r = kho.filter(x => bo(x.en + ' ' + x.vi).includes(q)).slice(0, 80);
    $('#kq').innerHTML = (r.length ? '' : '<div class="trong">Không thấy.</div>') + r.map(x => `<div class="cau"><button class="loa" data-a="${x.a}">🔊</button><div><div class="en">${esc(x.en)}</div>${x.ipa ? `<div class="ipa">${esc(x.ipa)}</div>` : ''}${x.vi ? `<div class="vi">${esc(x.vi)}</div>` : ''}<div class="ghi" style="color:var(--m)">${esc(x.n)}</div></div></div>`).join('');
    $('#kq').querySelectorAll('.loa').forEach(b => b.onclick = () => phat(b.dataset.a));
  };
}

function nav(t, im) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (im) return; if (t === 'bai') { location.hash = ''; dsBai(); } else if (t === 'on') moOn(); else moTra();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => nav(b.dataset.t));
const h = location.hash.slice(1);
if (h.startsWith('bai-') && theo(h.slice(4))) moBai(h.slice(4), 'cau'); else if (h === 'on') moOn(); else if (h === 'tra') { nav('tra', true); moTra(); } else dsBai();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script></body></html>
