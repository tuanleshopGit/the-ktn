<style>
/* Layout: một mục từ điển — đầu mục "like" trên cùng, thanh nghĩa, thẻ lật ở giữa, nút ôn dưới */
:root{
  --giay:#f6f8fb; --mat:#ffffff; --muc:#1d2b4f; --chu:#28324a; --nhat:#66708a; --vien:#d9dfea;
  --dqang:#ffe27a; --dqang-chu:#4a3a00; --xanh:#1f7a5c; --do:#b4433a; --ipa:#2f5fb3;
  --f-dau:"Literata",Georgia,serif; --f-than:"Be Vietnam Pro",system-ui,sans-serif; --f-ipa:"Noto Sans","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --giay:#11151f; --mat:#1a2030; --muc:#dfe6ff; --chu:#d7dcea; --nhat:#9099b2; --vien:#2c3448;
  --dqang:#6b5a12; --dqang-chu:#fff2bf; --xanh:#5fd0a6; --do:#ff8a7e; --ipa:#8fb4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --giay:#11151f; --mat:#1a2030; --muc:#dfe6ff; --chu:#d7dcea; --nhat:#9099b2; --vien:#2c3448;
  --dqang:#6b5a12; --dqang-chu:#fff2bf; --xanh:#5fd0a6; --do:#ff8a7e; --ipa:#8fb4ff; color-scheme:dark}
body{background:var(--giay);color:var(--chu);font-family:var(--f-than);font-size:16px;line-height:1.5}
.khung{max-width:680px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--muc);padding-bottom:10px}
header h1{font-family:var(--f-dau);font-size:2.6rem;margin:0;color:var(--muc);line-height:1}
.ipa-tu{font-family:var(--f-ipa);color:var(--ipa);font-size:1.15rem}
.loai{color:var(--nhat);font-style:italic;font-size:.95rem;flex-basis:100%}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ipa);outline-offset:2px}
.loa{border:1px solid var(--vien);background:var(--mat);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.loa svg{width:18px;height:18px;fill:var(--muc)}
.che-do{display:flex;gap:6px}
.che-do button{border:1px solid var(--vien);background:var(--mat);border-radius:8px;padding:6px 14px;font-weight:500}
.che-do button[aria-pressed="true"]{background:var(--muc);color:var(--mat);border-color:var(--muc)}
.nhom{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.nhom button{white-space:nowrap;border:none;background:transparent;padding:5px 10px;border-radius:6px;color:var(--nhat);font-size:.92rem}
.nhom button[aria-pressed="true"]{background:var(--dqang);color:var(--dqang-chu);font-weight:600}
.tom{color:var(--nhat);font-size:.92rem;margin:-8px 0 0}
.tien{display:flex;justify-content:space-between;color:var(--nhat);font-size:.85rem;font-variant-numeric:tabular-nums}
.the{perspective:1200px;min-height:300px}
.the-trong{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.the.lat .the-trong{transform:rotateY(180deg)}
.mat{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--mat);border:1px solid var(--vien);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.mat.sau{transform:rotateY(180deg)}
.ct{font-family:var(--f-dau);font-weight:700;font-size:1.3rem;color:var(--muc);text-wrap:balance}
.ct mark{background:linear-gradient(transparent 55%,var(--dqang) 55%);color:inherit}
.nghia{color:var(--nhat)}
.vi{font-size:1.25rem;margin-top:auto}
.goi{color:var(--nhat);font-size:.85rem}
.en-hang{display:flex;gap:10px;align-items:flex-start}
.en{font-family:var(--f-dau);font-size:1.35rem;color:var(--muc);font-weight:500}
.ipa{font-family:var(--f-ipa);color:var(--ipa);font-size:.98rem}
.luu{border-left:3px solid var(--dqang);padding-left:10px;font-size:.93rem}
.dich{color:var(--nhat);font-size:.95rem}
.nut{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.nut button{border:1px solid var(--vien);background:var(--mat);border-radius:10px;padding:10px 4px;font-weight:500;font-size:.93rem}
.nut .on{color:var(--do)} .nut .thuoc{color:var(--xanh)}
.dau{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:middle}
.toc{display:flex;gap:8px;align-items:center;color:var(--nhat);font-size:.85rem;flex-wrap:wrap}
.toc button{border:1px solid var(--vien);background:var(--mat);border-radius:6px;padding:3px 10px}
.toc button[aria-pressed="true"]{border-color:var(--muc);color:var(--muc);font-weight:600}
.bang section{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.bang h2{font-family:var(--f-dau);font-size:1.15rem;color:var(--muc);margin:0;border-bottom:1px solid var(--vien);padding-bottom:4px}
.dong{display:flex;gap:10px;align-items:flex-start}
.dong>div{min-width:0}
.dong .ct2{font-weight:600;color:var(--muc)}
.dong .en2{font-family:var(--f-dau)}
.trong{color:var(--nhat);text-align:center;padding:40px 0}
@media (max-width:420px){header h1{font-size:2.2rem}.nut button{font-size:.85rem}}
@media (prefers-reduced-motion:reduce){.the-trong{transition:none}}
</style>

</div>

weɪtɪŋ/"}, {"n": "dt", "ct": "Do you like ...?", "nghia": "bạn có thích ... không?", "vi": "Anh có thích căn nhà này không?", "en": "Do you like this house?", "luu": "Trả lời: Yes, I do. / No, I don't.", "am": "1be112e073", "ipa": "/du ju laɪk ðɪs haʊs/"}, {"n": "dt", "ct": "would like + to V", "nghia": "muốn làm gì (lịch sự)", "vi": "Tôi muốn xem lô đất.", "en": "I would like to see the land.", "luu": "would like = want nhưng lịch sự hơn. Nói tắt: I'd like.", "am": "c3d9158e9f", "ipa": "/aɪ wʊd laɪk tɪ si ðə lænd/"}, {"n": "dt", "ct": "I'd like + danh từ", "nghia": "tôi muốn có (lịch sự)", "vi": "Cho tôi một cốc cà phê.", "en": "I'd like a coffee, please.", "luu": "Câu gọi món hay dùng nhất.", "am": "ff138f7a5e", "ipa": "/aɪd laɪk ə ˈkɔfi, pliz/"}, {"n": "dt", "ct": "Would you like ...?", "nghia": "anh/chị có muốn ... không? (mời)", "vi": "Anh có muốn uống trà không?", "en": "Would you like some tea?", "luu": "Câu mời lịch sự. Trả lời: Yes, please. / No, thank you.", "am": "a3a36e5518", "ipa": "/wʊd ju laɪk səm ti/"}, {"n": "dt", "ct": "Would you like to + V?", "nghia": "anh/chị có muốn làm gì không?", "vi": "Anh có muốn đi xem đất ngày mai không?", "en": "Would you like to visit the land tomorrow?", "luu": "", "am": "ce35fd2038", "ipa": "/wʊd ju laɪk tɪ ˈvɪzɪt ðə lænd təˈmɑˌroʊ/"}, {"n": "gt", "ct": "look like + danh từ", "nghia": "trông giống", "vi": "Trông như sắp mưa.", "en": "It looks like rain.", "luu": "look like + danh từ. Nếu là tính từ thì bỏ like: It looks nice.", "am": "d547090fca", "ipa": "/ɪt lʊks laɪk reɪn/"}, {"n": "gt", "ct": "look like", "nghia": "trông giống ai", "vi": "Cô ấy trông giống mẹ.", "en": "She looks like her mother.", "luu": "", "am": "d8b4d8ab36", "ipa": "/ʃi lʊks laɪk hər ˈməðər/"}, {"n": "gt", "ct": "sound like", "nghia": "nghe có vẻ", "vi": "Nghe có vẻ là một món hời.", "en": "That sounds like a good deal.", "luu": "Có tính từ thì bỏ like: That sounds good.", "am": "a6b1e2fd3f", "ipa": "/ðət saʊnz laɪk ə gʊd dil/"}, {"n": "gt", "ct let tocDo = 1, nhomChon = 'tat', ds = [], i = 0;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function locDs(){
  ds = D.the.map((t,k)=>({...t,k})).filter(t => nhomChon==='tat' || (nhomChon==='on' ? luu[t.k]==='on' : t.n===nhomChon));

  document.querySelectorAll('#nhom button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m===nhomChon));

  $('mSau').innerHTML = `<div class="ct">${toDam(t.ct)}</div>
    <div class="en-hang"><button class="loa" data-am="${t.am}" aria-label="Đọc câu">${LOA}</button><div><div class="en">${toDam(t.en)}</div><div class="ipa">${esc(t.ipa)}</div></div></div>
    <div class="dich">${esc(t.vi)}</div>${t.luu ? `<div class="luu">${esc(t.luu)}</div>` : ''}`;
}
function lat(){ const th=$('the'); th.classList.toggle('lat'); if (th.classList.contains('lat') && ds.length) doc(ds[i].am); }
$('the').onclick = e => { const l = e.target.closest('.loa'); if (l){ e.stopPropagation(); doc(l.dataset.am); return; } lat(); };
$('the').onkeydown = e => { if (e.key===' '||e.key==='Enter'){ e.preventDefault(); lat(); } };
const di = d => { if (!ds.length) return; i = (i + d + ds.length) % ds.length; ve(); };
$('bLui').onclick = () => di(-1); $('bTien').onclick = () => di(1);
function danh(v){ if (!ds.length) return; const k = ds[i].k; luu[k] = luu[k]===v ? undefined : v; ghi();
  if (nhomChon==='on' && luu[k]!=='on'){ ds.splice(i,1); if (i>=ds.length) i=0; ve(); } else di(1); }
$('bOn').onclick = () => danh('on'); $('bThuoc').onclick = () => danh('thuoc');
$('bTron').onclick = () => { for (let a=ds.length-1;a>0;a--){ const b=Math.floor(Math.random()*(a+1)); [ds[a],ds[b]]=[ds[b],ds[a]]; } i=0; ve(); };
document.querySelectorAll('.toc [data-t]').forEach(b => b.onclick = () => { tocDo=+b.dataset.t; document.querySelectorAll('.toc [data-t]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('#the')) return; if (e.key==='ArrowRight') di(1); if (e.key==='ArrowLeft') di(-1); });

function veBang(){
  const nh = nhomChon==='tat'||nhomChon==='on' ? D.nhom : D.nhom.filter(n=>n.ma===nhomChon);
  $('vungBang').innerHTML = nh.map(n => {
    const ts = ds.filter(t=>t.n===n.ma); if (!ts.length) return '';
    return `<section><h2>${esc(n.ten)}</h2>${ts.map(t=>`<div class="dong"><button class="loa" data-am="${t.am}" aria-label="Đọc câu">${LOA}</button><div>
      <div class="ct2">${toDam(t.ct)} <span class="nghia">— ${esc(t.nghia)}</span></div>
      <div class="en2">${toDam(t.en)}</div><div class="ipa">${esc(t.ipa)}</div><div class="dich">${esc(t.vi)}</div>
      ${t.luu?`<div class="luu">${esc(t.luu)}</div>`:''}</div></div>`).join('')}</section>`;
  }).join('') || '<p class="trong">Chưa có thẻ nào ở đây.</p>';
}
$('vungBang').onclick = e => { const l = e.target.closest('.loa'); if (l) doc(l.dataset.am); };
function cheDo(bang){ $('vungThe').hidden = bang; $('vungBang').hidden = !bang; $('cdThe').setAttribute('aria-pressed', !bang); $('cdBang').setAttribute('aria-pressed', bang); }
$('cdThe').onclick = () => cheDo(false); $('cdBang').onclick = () => cheDo(true);
locDs();
</script>
